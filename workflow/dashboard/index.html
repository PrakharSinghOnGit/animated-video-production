<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wealth Gap Production</title>
<link rel="icon" href="/brand/WaterMark.png">
<style>
:root { color-scheme: dark;
  --bg: #0b0b0b; --p1: #111111; --p2: #171717; --p3: #1e1e1e; --line: #262626; --line2: #333;
  --text: #f2e9e4; --dim: #b3aba6; --faint: #7d7672;
  --green: #60935d; --orange: #dc851f; --red: #bc4b51; --blue: #6c8fb3;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #2b2b2b; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
a { color: var(--orange); text-decoration: none; } a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 12px; }
.dim { color: var(--dim); } .faint { color: var(--faint); } .num { font-variant-numeric: tabular-nums; }

/* shell: full viewport, three panes, no outer margins */
.app { display: grid; height: 100vh; grid-template-rows: 48px minmax(0, 1fr); grid-template-columns: 248px minmax(0, 1fr) 340px; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 12px 0 10px; background: #000; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 226px; }
.brand img { width: 28px; height: 28px; border-radius: 4px; }
.brand b { font-weight: 700; letter-spacing: -.01em; font-size: 14px; } .brand span { color: var(--faint); font-size: 12px; }
.crumb { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb .mono { color: var(--text); }
.grow { flex: 1; }
.meters { display: flex; gap: 14px; align-items: center; }
.meter { display: grid; grid-template-columns: auto 64px auto; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); }
.bar { height: 6px; background: var(--p3); border-radius: 3px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--green); transition: width .4s; }
.bar.w > i { background: var(--orange); } .bar.h > i { background: var(--red); }

.side { background: var(--p1); border-right: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; }
.main { overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.rail { background: var(--p1); border-left: 1px solid var(--line); overflow: auto; }

.sec-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 14px 12px 6px; display: flex; justify-content: space-between; align-items: center; }
.nav button, .wsitem { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--dim); }
.nav button:hover, .wsitem:hover { background: var(--p2); color: var(--text); }
.nav button.on, .wsitem.on { background: var(--p2); color: var(--text); border-left-color: var(--orange); }
.wsitem { flex-direction: column; align-items: stretch; gap: 4px; }
.wsitem .id { font-family: var(--mono); font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsitem .t { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsitem .row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--faint); }
.dots { display: flex; gap: 3px; }
.newv { padding: 8px 12px 14px; display: grid; gap: 6px; }
input[type=text], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; min-width: 0; }
input[type=number] { width: 90px; }
textarea { width: 100%; resize: vertical; font: 12.5px/1.55 var(--mono); padding: 10px 12px; }
input.bad { border-color: var(--red); }

/* status */
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #555; flex: none; display: inline-block; }
.dot[data-s=done] { background: var(--green); border-color: var(--green); }
.dot[data-s=stale] { border-color: var(--orange); background: transparent; }
.dot[data-s=partial] { border-color: var(--orange); background: linear-gradient(90deg, var(--orange) 50%, transparent 50%); }
.dot[data-s=running] { background: var(--orange); border-color: var(--orange); animation: pulse 1s ease-in-out infinite; }
.dot[data-s=failed] { background: var(--red); border-color: var(--red); }
@keyframes pulse { 50% { opacity: .3; } }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line2); color: var(--dim); white-space: nowrap; }
.pill[data-s=done] { color: #a6cfa3; border-color: #2e4a2d; background: #15201488; }
.pill[data-s=running], .pill[data-s=partial], .pill[data-s=stale] { color: #f1b46a; border-color: #5a3a12; background: #2a1c0a88; }
.pill[data-s=failed] { color: #ef9a9d; border-color: #5a2427; background: #2a111388; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #2a1c0a; color: #f1b46a; border: 1px solid #5a3a12; white-space: nowrap; }
.tag.free { background: #152014; color: #a6cfa3; border-color: #2e4a2d; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line2); background: var(--p3); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #4a4a4a; background: #252525; }
.btn.pri { background: var(--text); color: #111; border-color: var(--text); font-weight: 600; } .btn.pri:hover { background: #fff; }
.btn.danger { border-color: #5a2427; color: #ef9a9d; } .btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .tag { margin-left: 2px; }

/* stepper */
.stepper { display: flex; border-bottom: 1px solid var(--line); background: var(--p1); overflow-x: auto; flex: none; }
.stepper button { flex: 1; min-width: 110px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; padding: 9px 14px; background: none; border: 0; border-bottom: 2px solid transparent; border-right: 1px solid var(--line); cursor: pointer; color: var(--dim); text-align: left; }
.stepper button:hover { background: var(--p2); color: var(--text); }
.stepper button.on { background: var(--bg); color: var(--text); border-bottom-color: var(--orange); }
.stepper .n { font-size: 11px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.stepper .l { font-weight: 600; font-size: 13px; }
.stepper .m { font-size: 11px; color: var(--faint); }

.view { flex: 1; overflow: auto; min-height: 0; }
.panel-h { display: flex; gap: 16px; align-items: flex-start; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); background: var(--p1); position: sticky; top: 0; z-index: 5; }
.panel-h h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; }
.panel-h p { margin: 4px 0 0; color: var(--dim); max-width: 760px; }
.stats { display: flex; gap: 18px; margin-left: auto; }
.stat { text-align: right; } .stat b { display: block; font-size: 15px; font-weight: 600; } .stat span { font-size: 11px; color: var(--faint); }

.body { padding: 16px 20px 28px; display: grid; gap: 16px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); align-items: start; }
.card { background: var(--p1); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.card > .h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.card > .h h3 { margin: 0; font-size: 13px; font-weight: 600; } .card > .h .sub { color: var(--faint); font-size: 12px; }
.card > .b { padding: 12px 14px; display: grid; gap: 10px; }
.card > .b.flush { padding: 0; }

/* actions with options */
.actions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.action { border: 1px solid var(--line); border-radius: 8px; background: var(--p2); display: flex; flex-direction: column; }
.action .ah { display: flex; gap: 8px; align-items: center; padding: 10px 12px 4px; }
.action .ah b { font-size: 13px; } .action .help { color: var(--dim); font-size: 12px; padding: 0 12px 8px; }
.action .meta { color: var(--faint); font-size: 11px; margin-left: auto; white-space: nowrap; }
.action details { border-top: 1px solid var(--line); }
.action summary { cursor: pointer; padding: 6px 12px; color: var(--faint); font-size: 12px; list-style: none; } .action summary::before { content: "▸ "; } .action details[open] summary::before { content: "▾ "; }
.opts { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 4px 12px 10px; align-items: center; }
.opts label { color: var(--dim); font-size: 12px; } .opts small { display: block; color: var(--faint); font-size: 11px; }
.opts .multi { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: flex-end; max-width: 220px; }
.opts .multi label { display: flex; gap: 4px; align-items: center; color: var(--text); }
.action .go { padding: 8px 12px 12px; display: flex; gap: 8px; align-items: center; margin-top: auto; }
.cmdprev { font: 11px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

/* console */
.console { background: #050505; border-top: 1px solid var(--line); }
.console .ch { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.console pre { margin: 0; padding: 10px 12px; font: 11.5px/1.5 var(--mono); color: #cfc7c2; white-space: pre-wrap; word-break: break-word; overflow: auto; max-height: 340px; min-height: 120px; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 600; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--p1); }
td { padding: 6px 10px; border-bottom: 1px solid #1c1c1c; vertical-align: top; }
tr:hover td { background: #141414; } td.r, th.r { text-align: right; }
tr.sel td { background: #1a1408; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 12.5px; } .kv dt { color: var(--faint); } .kv dd { margin: 0; }
audio { width: 100%; height: 32px; } video { width: 100%; background: #000; border-radius: 6px; display: block; }
.audrow { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; font-size: 12px; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.thumbs figure { margin: 0; flex: none; cursor: zoom-in; } .thumbs img { height: 72px; border-radius: 4px; display: block; border: 1px solid var(--line); }
.thumbs figcaption { font: 10.5px var(--mono); color: var(--faint); text-align: center; }
.issue { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1c1c1c; font-size: 12.5px; }
.issue .t { font-family: var(--mono); color: var(--orange); cursor: pointer; } .issue .fix { color: var(--dim); }
.sev-high { color: #ef9a9d; } .sev-medium { color: #f1b46a; } .sev-low { color: var(--faint); }
.acts-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.actlist button { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 9px 12px; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; color: var(--dim); }
.actlist button:hover { background: var(--p2); color: var(--text); } .actlist button.on { background: var(--p2); color: var(--text); box-shadow: inset 2px 0 0 var(--orange); }
.actlist .id { font-family: var(--mono); color: var(--text); } .actlist .sc { font-size: 11px; color: var(--faint); text-align: right; }
.flow { display: flex; gap: 0; align-items: center; flex-wrap: wrap; }
.flow span { padding: 4px 10px; border: 1px solid var(--line2); color: var(--faint); font-size: 12px; }
.flow span:first-child { border-radius: 6px 0 0 6px; } .flow span:last-child { border-radius: 0 6px 6px 0; } .flow span + span { border-left: 0; }
.flow span.ok { color: #a6cfa3; background: #15201466; } .flow span.now { color: #f1b46a; background: #2a1c0a66; }
.md { white-space: pre-wrap; font-size: 12.5px; line-height: 1.6; color: var(--dim); max-height: 520px; overflow: auto; }
.empty { padding: 28px; color: var(--faint); text-align: center; }
.banner { width: 100%; max-width: 900px; border-radius: 8px; border: 1px solid var(--line); display: block; margin: 0 auto; }
.warn { border: 1px solid #5a2427; background: #2a111366; color: #f2c9cb; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; }
.note { border: 1px solid #5a3a12; background: #2a1c0a55; color: #f6d6ab; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; }

/* rail */
.rail .blk { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.spark { display: grid; grid-template-columns: 52px 1fr 56px; gap: 8px; align-items: center; padding: 3px 12px; font-size: 11.5px; color: var(--dim); }
.spark svg { width: 100%; height: 26px; display: block; } .spark b { text-align: right; color: var(--text); font-weight: 600; }
.cores { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; padding: 4px 12px 6px; }
.cores i { height: 22px; background: var(--p3); border-radius: 2px; position: relative; overflow: hidden; } .cores i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--v); background: var(--green); }
.job { padding: 8px 12px; border-bottom: 1px solid #1c1c1c; font-size: 12px; display: grid; gap: 3px; cursor: pointer; }
.job:hover { background: var(--p2); }
.job .r1 { display: flex; gap: 8px; align-items: center; } .job .r1 b { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .r2 { display: flex; gap: 10px; color: var(--faint); font-size: 11px; flex-wrap: wrap; }
.procs { font-size: 11.5px; } .procs td { padding: 3px 12px; }

.lb { position: fixed; inset: 0; background: #000e; display: none; align-items: center; justify-content: center; z-index: 50; flex-direction: column; gap: 10px; }
.lb.on { display: flex; } .lb img { max-width: 92vw; max-height: 84vh; } .lb .bar2 { display: flex; gap: 10px; align-items: center; color: var(--dim); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--p3); border: 1px solid var(--line2); padding: 8px 14px; border-radius: 8px; z-index: 60; display: none; }
.toast.on { display: block; }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding: 8px 4px 0; }
.chart .col { flex: 1; display: flex; flex-direction: column-reverse; min-width: 6px; position: relative; }
.chart .col i { display: block; } .chart .col:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--p3); border: 1px solid var(--line2); padding: 4px 8px; border-radius: 4px; white-space: pre; font-size: 11px; z-index: 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="/brand/Logo.png" alt=""><div><b>The Wealth Gap</b><br><span>Production</span></div></div>
    <div class="crumb" id="crumb"></div>
    <div class="grow"></div>
    <div class="meters" id="meters"></div>
    <div id="studioBox"></div>
  </header>

  <nav class="side">
    <div class="nav">
      <div class="sec-h">Views</div>
      <button data-view="ws" id="navWs">Workspace</button>
      <button data-view="usage">Claude usage</button>
      <button data-view="machine">Machine</button>
    </div>
    <div class="sec-h">Videos <span id="wsCount"></span></div>
    <div id="wsList"></div>
    <div class="sec-h">New video</div>
    <div class="newv">
      <input type="text" id="newId" placeholder="VID03_Short_Name" spellcheck="false" autocomplete="off">
      <button class="btn" id="newBtn">Create workspace</button>
      <div class="faint" style="font-size:11.5px">Letters, digits and underscores after <span class="mono">VIDn_</span>.</div>
    </div>
  </nav>

  <main class="main" id="main"></main>

  <aside class="rail" id="rail">
    <div class="blk"><div class="sec-h">Running now</div><div id="nowBox"></div></div>
    <div class="blk"><div class="sec-h">Machine <span id="machName" class="faint" style="text-transform:none;letter-spacing:0"></span></div><div id="sparks"></div></div>
    <div class="blk"><div class="sec-h">Recent runs</div><div id="recent"></div></div>
  </aside>
</div>
<div class="lb" id="lb"><img id="lbImg" alt=""><div class="bar2"><button class="btn sm" id="lbPrev">←</button><span id="lbCap" class="mono"></span><button class="btn sm" id="lbNote">Add note at this time</button><button class="btn sm" id="lbNext">→</button><button class="btn sm" id="lbClose">Close</button></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ───────────── helpers ─────────────
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dur = (ms) => { if (ms == null) return "—"; const s = Math.round(ms / 1000); if (s < 60) return s + " s"; const m = Math.floor(s / 60), h = Math.floor(m / 60); return h ? `${h} h ${m % 60} min` : `${m} min ${s % 60} s`; };
const money = (x) => x ? "$" + x.toFixed(2) : "$0";
const ago = (t) => { if (!t) return "—"; const s = (Date.now() - (typeof t === "string" ? Date.parse(t) : t)) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago"; };
const mb = (b) => b == null ? "—" : b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(1) + " MB";
const tok = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const STATUS = { none: "Not started", done: "Done", stale: "Out of date", partial: "In progress", running: "Running", failed: "Failed" };
const pill = (s, txt) => `<span class="pill" data-s="${s}"><span class="dot" data-s="${s}"></span>${esc(txt ?? STATUS[s] ?? s)}</span>`;
const file = (rel) => `/api/ws/${encodeURIComponent(S.ws)}/file?path=${encodeURIComponent(rel)}`;
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 4500); }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "x-wg": "1", ...(opts.body && typeof opts.body === "string" && opts.body[0] === "{" ? { "content-type": "application/json" } : {}), ...(opts.headers ?? {}) } });
  const ct = r.headers.get("content-type") ?? "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data?.error ?? r.statusText);
  return data;
}
const store = { get(k, d) { try { const v = localStorage.getItem("wg." + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("wg." + k, JSON.stringify(v)); } catch {} } };

// ───────────── state ─────────────
const S = { view: "ws", ws: null, step: "script", act: null, list: [], d: null, schema: {}, sys: null, activity: [], usage: null, logJob: null, es: null, dirty: {}, lb: { list: [], i: 0 } };
const STEPS = [
  ["script", "Script", "Draft → script → approval"], ["voice", "Voice", "Local voice clone"], ["align", "Align", "Timings, master, captions"],
  ["plan", "Plan", "Acts and beats"], ["acts", "Acts", "Draw, preview, review"], ["sound", "Sound", "Foley and mix"],
  ["render", "Render", "Draft, final, QC"], ["runs", "Runs", "History and costs"],
];
function readHash() { const h = new URLSearchParams(location.hash.slice(1)); S.view = h.get("view") ?? "ws"; S.ws = h.get("ws") ?? S.ws; S.step = h.get("step") ?? S.step; S.act = h.get("act") ?? S.act; }
function writeHash() { const h = new URLSearchParams(); h.set("view", S.view); if (S.ws) h.set("ws", S.ws); h.set("step", S.step); if (S.act) h.set("act", S.act); history.replaceState(null, "", "#" + h); }

// ───────────── keep-alive render: media, focused/dirty fields and open details survive re-renders ─────────────
function patch(el, html) {
  const keep = {}; $$("[data-keep]", el).forEach((n) => (keep[n.dataset.keep] = n));
  const open = new Set($$("details[open][data-id]", el).map((d) => d.dataset.id));
  const scroll = $$("[data-scroll]", el).map((n) => [n.dataset.scroll, n.scrollTop]);
  el.innerHTML = html;
  $$("[data-keep]", el).forEach((n) => {
    const old = keep[n.dataset.keep];
    if (!old) return;
    const same = old.getAttribute("data-src") === n.getAttribute("data-src");
    const editing = (old.tagName === "TEXTAREA" || old.tagName === "INPUT") && (document.activeElement === old || S.dirty[n.dataset.keep]);
    if ((old.tagName === "AUDIO" || old.tagName === "VIDEO" || old.tagName === "PRE") && same) n.replaceWith(old);
    else if (editing) n.replaceWith(old);
  });
  $$("details[data-id]", el).forEach((d) => { if (open.has(d.dataset.id)) d.open = true; });
  for (const [k, v] of scroll) { const n = $(`[data-scroll="${k}"]`, el); if (n) n.scrollTop = v; }
}

function optControl(key, o) {
  const saved = store.get(`opt.${key}`, {});
  const v = saved[o.key] ?? o.def;
  const id = `o_${key}_${o.key}`.replace(/\W/g, "_");
  const lab = `<label for="${id}">${esc(o.label)}${o.help ? `<small>${esc(o.help)}</small>` : ""}</label>`;
  if (o.type === "bool") return lab + `<input type="checkbox" id="${id}" data-opt="${o.key}" ${v ? "checked" : ""}>`;
  if (o.type === "select") return lab + `<select id="${id}" data-opt="${o.key}">${o.choices.map((c) => `<option ${String(c) === String(v) ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
  if (o.type === "number") return lab + `<input type="number" id="${id}" data-opt="${o.key}" ${o.min != null ? `min="${o.min}"` : ""} ${o.max != null ? `max="${o.max}"` : ""} step="${o.step ?? "any"}" value="${v ?? ""}" placeholder="default">`;
  if (o.type === "text") return lab + `<input type="text" id="${id}" data-opt="${o.key}" value="${esc(v ?? "")}" placeholder="optional" style="width:180px">`;
  if (o.type === "multi") {
    const choices = key === "acts.all" && o.key === "acts" ? (S.d?.plan?.acts ?? []).map((a) => a.id) : o.choices;
    const sel = new Set(Array.isArray(v) ? v : []);
    return lab + `<div class="multi" data-opt="${o.key}" data-multi>${choices.map((c) => `<label><input type="checkbox" value="${esc(c)}" ${sel.has(c) ? "checked" : ""}>${esc(c)}</label>`).join("")}</div>`;
  }
  return "";
}
function readOpts(box) {
  const o = {};
  $$("[data-opt]", box).forEach((n) => {
    const k = n.dataset.opt;
    if (n.dataset.multi !== undefined) o[k] = $$("input:checked", n).map((c) => c.value);
    else if (n.type === "checkbox") o[k] = n.checked;
    else if (n.type === "number") { if (n.value !== "") o[k] = Number(n.value); }
    else if (n.value !== "") o[k] = n.value;
  });
  return o;
}
function actionCard(key, act, extra = "") {

    <div class="ah"><b>${esc(a.label)}</b>${a.paid ? `<span class="tag">Paid · ${esc(a.paid)}</span>` : `<span class="tag free">Free</span>`}<span class="meta">${a.long ? esc(a.long) : ""}</span></div>

    ${a.opts.length ? `<details data-id="opt-${key}"><summary>Options (${a.opts.length})</summary><div class="opts">${a.opts.map((o) => optControl(key, o)).join("")}</div></details>` : ""}

function attachLog(jobId) {
  if (S.es) { S.es.close(); S.es = null; }
  S.logJob = jobId;
  const pre = $("#logPre"); if (!pre) return;
  pre.setAttribute("data-src", jobId); pre.textContent = "";
  const es = new EventSource(`/api/ws/${encodeURIComponent(S.ws)}/log/${jobId}`);
  S.es = es;
  const append = (s) => { const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30; pre.textContent += s; if (atEnd) pre.scrollTop = pre.scrollHeight; };
  es.addEventListener("reset", () => { pre.textContent = ""; });
  es.addEventListener("chunk", (e) => append(JSON.parse(e.data)));
  es.addEventListener("end", () => { es.close(); S.es = null; refreshWs(); });
  es.onerror = () => { es.close(); S.es = null; };
}
async function loadLastLog(stepKey) {
  const pre = $("#logPre"); if (!pre) return;
  const mine = (S.d?.jobs ?? []).filter((j) => j.step === stepKey || j.step.startsWith(stepKey.replace(/:.*/, "") + ":") && stepKey.includes(":") === false).pop();

  if (job) { if (pre.getAttribute("data-src") !== job.id || (job.status === "running" && !S.es)) attachLog(job.id); return; }
  if (pre.getAttribute("data-src") === "last:" + stepKey) return;

}

      ${u.sessions.filter((s) => (proj === "all" || s.project === proj) && (kindF === "all" || s.kind === kindF)).map((s) => `<tr><td class="faint">${s.last ? new Date(s.last).toLocaleString() : ""}</td><td>${esc(s.project)}</td><td>${esc(s.kind)}</td><td class="mono">${Object.keys(s.models).map(esc).join(", ")}</td><td class="r">${tok(s.total.in + s.total.cacheWrite)}</td><td class="r">${tok(s.total.cacheRead)}</td><td class="r">${tok(s.total.out)}</td><td class="r">${s.total.replies}</td><td class="mono faint">${esc(s.id.slice(0, 8))}</td></tr>`).join("")}</table></div></div>
    <div class="card"><div class="h"><h3>Pipeline steps with a model</h3></div><div class="b flush" style="max-height:420px;overflow:auto"><table><tr><th>When</th><th>Video</th><th>Step</th><th>Model</th><th class="r">Time</th><th class="r">Cost</th></tr>
      ${[...pipe].sort((a, b) => String(b.at).localeCompare(String(a.at))).map((r) => `<tr><td class="faint">${r.at ? new Date(r.at).toLocaleString() : ""}</td><td class="mono">${esc(r.ws)}</td><td>${esc(r.step)}</td><td class="mono">${esc(r.model ?? "")}</td><td class="r">${dur(r.ms)}</td><td class="r">${r.costUsd ? money(r.costUsd) : "free"}</td></tr>`).join("")}</table></div></div>
  </div></div>`;
}
function renderMachine() {
  const s = S.sys, main = $("#main");
  $("#crumb").innerHTML = "Machine";
  if (!s) { main.innerHTML = `<div class="empty">Loading…</div>`; return; }
  const H = s.history, n = s.now;
  const big = (l, vals, max, col, val) => `<div class="card"><div class="h"><h3>${l}</h3><span class="grow"></span><b>${val}</b></div><div class="b">${sparkSvg(vals, max, col).replace('viewBox="0 0 200 26"', 'viewBox="0 0 200 26" style="height:120px;width:100%"')}</div></div>`;
  patch(main, `<div class="view"><div class="panel-h"><div><h2>Machine</h2><p>${esc(s.machine.cpu)} · ${s.machine.cores} cores · ${s.machine.memGB} GB · ${esc(s.machine.host)}. Sampled every 2 s while this page is open or a job runs (last ${Math.round((H.length * 2) / 60)} min).</p></div></div><div class="body">
    <div class="cols">${big("CPU", H.map((x) => x.cpu), 100, "#60935d", n.cpu.toFixed(0) + "%")}${big("GPU", H.map((x) => x.gpu), 100, "#dc851f", (n.gpu ?? "—") + "%")}
    ${big("Memory", H.map((x) => x.memUsedGB), n.memTotalGB, "#6c8fb3", `${n.memUsedGB} / ${n.memTotalGB} GB${n.swapUsedGB ? ` · swap ${n.swapUsedGB} GB` : ""}`)}${big("GPU memory", H.map((x) => x.gpuMemGB ?? 0), Math.max(1, ...H.map((x) => x.gpuMemGB ?? 0)), "#bc4b51", (n.gpuMemGB ?? "—") + " GB")}</div>
    <div class="card"><div class="h"><h3>Cores</h3></div><div class="b"><div class="cores" style="padding:0;grid-template-columns:repeat(${n.cores.length},1fr)">${n.cores.map((c) => `<i style="--v:${c}%;height:80px" title="${c}%"></i>`).join("")}</div></div></div>
    <div class="card"><div class="h"><h3>Top processes</h3></div><div class="b flush"><table><tr><th>Process</th><th class="r">PID</th><th class="r">CPU</th><th class="r">Memory</th></tr>${s.top.map((p) => `<tr><td class="mono">${esc(p.comm)}</td><td class="r faint">${p.pid}</td><td class="r">${p.cpu}%</td><td class="r">${p.rssMB} MB</td></tr>`).join("")}</table></div></div>
  </div></div>`);
}

// ───────────── navigation ─────────────
function setView(v) {
  S.view = v; writeHash();
  $$(".nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  if (v === "ws") { $("#main").innerHTML = ""; refreshWs(); loadScriptText(); }
  else if (v === "usage") { renderUsage(); loadUsage(); }
  else renderMachine();
  loadList();
}
async function loadScriptText() {
  if (!S.ws) return;
  try { S.scriptText = await api(`/api/ws/${encodeURIComponent(S.ws)}/script`); } catch { S.scriptText = ""; }
  S.dirty.script = false;
  const ta = $("#scriptTa"); if (ta && document.activeElement !== ta) ta.value = S.scriptText;
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, a, figure, [data-goto], [data-seek]");
  if (!t) return;
  if (t.dataset.view) return setView(t.dataset.view);
  if (t.dataset.ws) { S.ws = t.dataset.ws; S.act = null; S.d = null; if (S.es) { S.es.close(); S.es = null; } S.logJob = null; return setView("ws"); }
  if (t.dataset.step) { S.step = t.dataset.step; writeHash(); if (S.es) { S.es.close(); S.es = null; } S.logJob = null; $("#view").scrollTop = 0; return renderWs(); }
  if (t.dataset.actSel) { S.act = t.dataset.actSel; writeHash(); if (S.es) { S.es.close(); S.es = null; } S.logJob = null; return renderWs(); }
  if (t.dataset.openact) { e.preventDefault(); S.act = t.dataset.openact; S.step = "acts"; writeHash(); return renderWs(); }
  if (t.dataset.goto) { const [ws, step, id] = t.dataset.goto.split("|"); S.ws = ws; S.step = step.includes(":") ? "acts" : ["script", "voice", "align", "plan", "acts", "sound", "render"].includes(step) ? step : "runs"; if (step.includes(":")) S.act = step.split(":")[1]; S.view = "ws"; writeHash(); setView("ws"); setTimeout(() => attachLog(id), 400); return; }
  if (t.hasAttribute("data-run")) return runAction(t.closest(".action"));
  if (t.id === "stopBtn") { if (confirm("Stop the running job?")) { try { await api(`/api/ws/${encodeURIComponent(S.ws)}/stop`, { method: "POST" }); toast("Stopping…"); } catch (er) { toast(er.message); } } return; }
  if (t.dataset.save) { const v = $(`[data-field="${t.dataset.save}"]`).value; try { await api(`/api/ws/${encodeURIComponent(S.ws)}/text/${t.dataset.save}`, { method: "PUT", body: v }); S.dirty[t.dataset.save] = false; toast("Saved"); refreshWs(); } catch (er) { toast(er.message); } return; }
  if (t.id === "saveScript") { const v = $("#scriptTa").value; try { await api(`/api/ws/${encodeURIComponent(S.ws)}/script`, { method: "PUT", body: v }); S.scriptText = v; S.dirty.script = false; toast("Script saved"); refreshWs(); } catch (er) { toast(er.message); } return; }
  if (t.dataset.savenotes) return saveNotes(t.dataset.savenotes);
  if (t.dataset.addissue) { const x = JSON.parse(t.dataset.addissue), ta = $("#notesTa"); ta.value = (ta.value.trim() ? ta.value.replace(/\s*$/, "\n") : "") + `${x.time}: ${x.seen}${x.said ? ` (said: "${x.said}")` : ""}. Fix: ${x.fix}`; S.dirty[`notes:${S.act}`] = true; toast("Added to notes (not saved yet)"); return; }
  if (t.id === "noteAtVideo") { const v = $("#actVideo"); return addNoteAt(v ? v.currentTime : 0); }
  if (t.dataset.seek !== undefined) { const v = $("#actVideo"); if (v) { v.currentTime = Number(t.dataset.seek) || 0; v.play(); } return; }
  if (t.dataset.lb !== undefined) { S.lb.i = Number(t.dataset.lb); return showLb(); }
  if (t.id === "lbClose") return $("#lb").classList.remove("on");
  if (t.id === "lbPrev") { S.lb.i = (S.lb.i - 1 + S.lb.list.length) % S.lb.list.length; return showLb(); }
  if (t.id === "lbNext") { S.lb.i = (S.lb.i + 1) % S.lb.list.length; return showLb(); }
  if (t.id === "lbNote") { $("#lb").classList.remove("on"); return addNoteAt(S.lb.list[S.lb.i]?.t ?? 0); }
  if (t.id === "studioStart") { try { await api(`/api/ws/${encodeURIComponent(S.ws)}/studio`, { method: "POST" }); toast("Starting Remotion Studio…"); setTimeout(loadActivity, 1500); } catch (er) { toast(er.message); } return; }
  if (t.id === "studioStop") { try { await api("/api/studio/stop", { method: "POST" }); setTimeout(loadActivity, 800); } catch (er) { toast(er.message); } return; }
  if (t.id === "newBtn") return newVideo();
  if (t.id === "uRefresh") return loadUsage(true);
  if (t.id === "savePrices") { const p = {}; $$("[data-price]").forEach((r) => { const o = {}; $$("[data-pk]", r).forEach((i) => { if (i.value !== "") o[i.dataset.pk] = Number(i.value); }); if (Object.keys(o).length) p[r.dataset.price] = o; }); store.set("prices", p); toast("Prices saved in this browser"); return renderUsage(); }
});
document.addEventListener("input", (e) => { const f = e.target.dataset?.field; if (f) S.dirty[f] = true; });
document.addEventListener("change", (e) => {
  if (e.target.id === "uProj") { store.set("usageProject", e.target.value); renderUsage(); }
  if (e.target.id === "uKind") { store.set("usageKind", e.target.value); renderUsage(); }
});
document.addEventListener("keydown", (e) => {
  if ($("#lb").classList.contains("on")) { if (e.key === "Escape") $("#lb").classList.remove("on"); if (e.key === "ArrowLeft") $("#lbPrev").click(); if (e.key === "ArrowRight") $("#lbNext").click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { const f = document.activeElement?.dataset?.field; if (!f) return; e.preventDefault(); if (f === "script") $("#saveScript").click(); else if (f.startsWith("notes:")) saveNotes(f.slice(6)); else $(`[data-save="${f}"]`)?.click(); }
});
function addNoteAt(t) {
  const ta = $("#notesTa"); if (!ta) return;
  ta.value = (ta.value.trim() ? ta.value.replace(/\s*$/, "\n") : "") + `${t.toFixed(1)} s: `;
  S.dirty[`notes:${S.act}`] = true; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
async function saveNotes(act) {
  const ta = $(`[data-field="notes:${act}"]`);
  try { await api(`/api/ws/${encodeURIComponent(S.ws)}/notes/${act}`, { method: "PUT", body: ta.value }); S.dirty[`notes:${act}`] = false; toast("Notes saved"); refreshWs(); } catch (e) { toast(e.message); }
}
function showLb() { const x = S.lb.list[S.lb.i]; if (!x) return; $("#lbImg").src = x.src; $("#lbCap").textContent = `${x.t.toFixed(2)} s  (${S.lb.i + 1}/${S.lb.list.length})`; $("#lb").classList.add("on"); }
async function newVideo() {
  const inp = $("#newId"), id = inp.value.trim();
  if (!/^VID\d+_[A-Za-z0-9_]+$/.test(id)) { inp.classList.add("bad"); toast("Use VID<number>_<Name>, e.g. VID03_Debt_Spiral"); return; }
  inp.classList.remove("bad");
  try { await api("/api/workspaces", { method: "POST", body: JSON.stringify({ id }) }); toast(`Creating ${id}…`); setTimeout(async () => { await loadList(); S.ws = id; S.step = "script"; setView("ws"); }, 2500); } catch (e) { toast(e.message); }
}
// live command preview under each Run button
document.addEventListener("input", (e) => { const box = e.target.closest?.(".action"); if (box) cmdPreview(box); });
document.addEventListener("change", (e) => { const box = e.target.closest?.(".action"); if (box) cmdPreview(box); });
function cmdPreview(box) {
  const o = readOpts(box), parts = Object.entries(o).filter(([, v]) => v !== false && !(Array.isArray(v) && !v.length)).map(([k, v]) => v === true ? k : `${k}=${Array.isArray(v) ? v.join(",") : v}`);
  const el = $("[data-cmdprev]", box); if (el) el.textContent = parts.join(" · ");
}

// ───────────── loops ─────────────
readHash();
(async () => {
  try { S.schema = await api("/api/schema"); } catch {}
  await loadList();
  setView(S.view);
  loadSystem(); loadActivity();
  setInterval(loadSystem, 2000);
  setInterval(loadActivity, 3000);
  setInterval(loadList, 6000);
  setInterval(() => { if (S.view !== "ws" || !S.ws) return; const busy = S.d?.jobs?.some((j) => j.status === "running"); const typing = ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement?.tagName); if (busy || !typing) refreshWs(); }, 3000);
  setInterval(() => { if (S.view === "usage") loadUsage(); }, 30000);
})();
</script>
</body>
</html>
